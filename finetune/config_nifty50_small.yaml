data:
  data_path: "data/nifty50_daily.csv"
  lookback_window: 120
  predict_window: 20
  max_context: 512
  clip: 5.0
  train_ratio: 0.85
  val_ratio: 0.15
  test_ratio: 0.0

training:
  tokenizer_epochs: 1
  basemodel_epochs: 1
  batch_size: 16
  log_interval: 10
  num_workers: 2
  seed: 42
  
  tokenizer_learning_rate: 0.0001
  predictor_learning_rate: 0.00001
  
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.05
  accumulation_steps: 1

model_paths:
  pretrained_tokenizer: "NeoQuasar/Kronos-Tokenizer-base"
  pretrained_predictor: "NeoQuasar/Kronos-small"
  
  exp_name: "nifty50_small_v1"
  base_path: "finetuned"
  base_save_path: ""
  finetuned_tokenizer: ""
  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "kronos_nifty50_benchmark"
  description: "Kronos benchmark test on NIFTY 50"
  use_comet: false
  train_tokenizer: true
  train_basemodel: true
  skip_existing: false

device:
  use_cuda: false
  device_id: 0
